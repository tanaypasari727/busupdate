<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bus Route Finder</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #3498db;
      --dark: #2c3e50;
      --bg: #f4f7fa;
      --white: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--dark);
    }

    h1 {
      text-align: center;
      padding: 20px;
      font-size: 2.5rem;
      color: var(--primary);
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .search-box {
      background: var(--white);
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    label {
      font-weight: 600;
      display: block;
      margin: 15px 0 5px;
    }

    select, input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 10px;
      transition: 0.3s;
    }

    select:focus, input:focus {
      border-color: var(--primary);
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      background: linear-gradient(to right, #3498db, #1abc9c);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s ease;
    }

    button:hover {
      transform: scale(1.03);
    }

    .results {
      margin-top: 30px;
    }

    .bus-card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      margin-bottom: 25px;
      padding: 20px;
      overflow: hidden;
    }

    .bus-info {
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
    }

    .bus-image {
      flex: 0 0 100px;
      height: 60px;
      background: url('https://cdn-icons-png.flaticon.com/512/69/69944.png') center/cover no-repeat;
      border-radius: 8px;
    }

    .bus-details {
      flex: 1;
    }

    .bus-details h3 {
      margin: 0 0 5px;
      font-size: 20px;
      color: var(--dark);
    }

    .bus-details p {
      margin: 5px 0;
      color: #555;
    }

    .map-route {
  position: relative;
  margin-top: 20px;
  padding-left: 20px; /* extra space for the vertical line */
}

.stop {
  position: relative;
  padding: 10px 20px;
  margin: 30px 0;
  width: fit-content;
  max-width: 80%;
  background-color: #fff;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  transition: transform 0.3s ease;
}

.stop::before {
  content: '';
  position: absolute;
  top: 10px;
  left: -28px;
  width: 12px;
  height: 12px;
  background: var(--primary);
  border-radius: 50%;
  z-index: 1;
}

/* vertical line via ::after */
.map-route::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0px;
  width: 4px;
  height: 100%;
  background: var(--primary);
  border-radius: 2px;
}

    @media (max-width: 600px) {
      .bus-info {
        flex-direction: column;
        align-items: flex-start;
      }

      .bus-image {
        width: 100%;
      }

      .bus-details {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <h1>🚌 Bus Route Finder</h1>

  <div class="container">
    <div class="search-box">
      <label for="searchType">Search By:</label>
      <select id="searchType" onchange="updateSearchForm()">
        <option value="source-destination">Source to Destination</option>
        <option value="bus-name">Bus Name</option>
        <option value="bus-number">Bus Number</option>
      </select>

      <div id="sourceDestinationSearch" class="search-type">
        <label for="source">Source:</label>
        <select id="source"></select>

        <label for="destination">Destination:</label>
        <select id="destination"></select>
      </div>

      <div id="busNameSearch" class="search-type" style="display: none;">
        <label for="busName">Search by Bus Name:</label>
        <input type="text" id="busName" placeholder="Enter bus name...">
      </div>

      <div id="busNumberSearch" class="search-type" style="display: none;">
        <label for="busNumber">Search by Bus Number:</label>
        <input type="text" id="busNumber" placeholder="Enter bus number...">
      </div>

      <label for="timeFilter">Filter by Time:</label>
      <select id="timeFilter">
        <option value="">All</option>
        <option value="morning">Morning (5 AM - 12 PM)</option>
        <option value="afternoon">Afternoon (12 PM - 5 PM)</option>
        <option value="evening">Evening (5 PM - 10 PM)</option>
      </select>

      <button onclick="searchRoutes()">Search</button>
    </div>

    <div class="results" id="results"></div>
  </div>

  <script>
  const busRoutes = [
  {
    busNumber: "WB11C5920",
    busName: "Biswabina",
    contact: "+91-9876543210",
    image: "https://scontent.fccu25-1.fna.fbcdn.net/v/t39.30808-6/480749297_1030054155613240_7465941670769110655_n.jpg?stp=dst-jpg_s720x720_tt6&_nc_cat=105&ccb=1-7&_nc_sid=aa7b47&_nc_ohc=WyFff9VrDGEQ7kNvwGq0KJz&_nc_oc=AdnFA8mOolcjgXnL4DF3UM1CjOWXwVEXSCPqe14fdU9YmCxxwfx9kVdN2qoeT2Lp91-NLy3la1DqtIUcG_Q2PgeQ&_nc_zt=23&_nc_ht=scontent.fccu25-1.fna&_nc_gid=JLfN5uf9JMcOy7c-3w6Vzw&oh=00_AfHMm8zaqbkVWXXZHgEFkcqSCDU3Iey_G17T1PjAR8muyw&oe=68185F28", // Add image URL
    notice: "Garhbeta-Kolkata Station",
    route: [
      { stop: "Garhbeta", time: "11:40 AM" },
      { stop: "Panikotor", time: "NULL" },
      { stop: "Raskundu", time: "NULL" },
      { stop: "Chandrakona Town", time: "NULL" },
      { stop: "Khirpai", time: "NULL" },
      { stop: "Barda Chowkan", time: "NULL" },
      { stop: "Ghatal", time: "01:25 PM" },
      { stop: "Daspur", time: "NULL" },
      { stop: "Sultan Nagar", time: "NULL" },
      { stop: "Goura", time: "NULL" },
      { stop: "Khukurdaha", time: "NULL" },
      { stop: "Keshapat", time: "NULL" },
      { stop: "Mechogram", time: "NULL" },
      { stop: "Sidha", time: "NULL" },
      { stop: "Deulia Bazar", time: "NULL" },
      { stop: "Kolaghat", time: "NULL" },
      { stop: "Bagnan", time: "NULL" },
      { stop: "Uluberia (Nimdighi)", time: "NULL" },
      { stop: "Dhulagarh", time: "NULL" },
      { stop: "Kona Expressway", time: "NULL" },
      { stop: "Salap", time: "NULL" },
      { stop: "Bally Hault", time: "NULL" },
      { stop: "Dakshineswar", time: "NULL" },
      { stop: "Dunlop", time: "NULL" },
      { stop: "Sinthi More", time: "NULL" },
      { stop: "Shyambazar", time: "NULL" },
      { stop: "Kolkata Station", time: "5:10 PM" }
    ]
  },
  {
    busNumber: "202",
    busName: "Town Liner",
    contact: "+91-9123456780",
    image: "https://example.com/town-liner.jpg", // Add image URL
    notice: "No Update",
    route: [
      { stop: "B", time: "12:30 PM" },
      { stop: "D", time: "01:00 PM" },
      { stop: "E", time: "01:30 PM" }
    ]
  },
  {
    busNumber: "303",
    busName: "Metro Shuttle",
    contact: "+91-9988776655",
    image: "https://example.com/metro-shuttle.jpg", // Add image URL
    notice: "No Update",
    route: [
      { stop: "A", time: "05:30 PM" },
      { stop: "D", time: "06:15 PM" },
      { stop: "E", time: "07:00 PM" }
    ]
  }
];


  const sourceSelect = document.getElementById("source");
  const destinationSelect = document.getElementById("destination");
  const searchTypeSelect = document.getElementById("searchType");
  const resultsDiv = document.getElementById("results");

  function updateSearchForm() {
    const searchType = searchTypeSelect.value;
    document.querySelectorAll(".search-type").forEach(div => div.style.display = "none");
    if (searchType === "source-destination") {
      document.getElementById("sourceDestinationSearch").style.display = "block";
    } else if (searchType === "bus-name") {
      document.getElementById("busNameSearch").style.display = "block";
    } else if (searchType === "bus-number") {
      document.getElementById("busNumberSearch").style.display = "block";
    }
  }

  function populateStops() {
    const stops = [...new Set(busRoutes.flatMap(bus => bus.route.map(r => r.stop)))];
    stops.forEach(stop => {
      const option1 = document.createElement("option");
      option1.textContent = stop;
      const option2 = option1.cloneNode(true);
      sourceSelect.appendChild(option1);
      destinationSelect.appendChild(option2);
    });
  }

  function getTimePeriod(timeStr) {
    const [hourStr, minutePart] = timeStr.split(":");
    const hour = parseInt(hourStr);
    const isPM = minutePart.includes("PM");

    const militaryHour = isPM ? (hour % 12) + 12 : (hour % 12);
    if (militaryHour >= 5 && militaryHour < 12) return "morning";
    if (militaryHour >= 12 && militaryHour < 17) return "afternoon";
    if (militaryHour >= 17 && militaryHour <= 22) return "evening";
    return "other";
  }

  function searchRoutes() {
  const searchType = searchTypeSelect.value;
  const timeFilter = document.getElementById("timeFilter").value;
  let filtered = [];

  if (searchType === "source-destination") {
    const source = sourceSelect.value;
    const destination = destinationSelect.value;

    filtered = busRoutes
      .map(bus => {
        const stops = bus.route.map(r => r.stop);
        const srcIdx = stops.indexOf(source);
        const destIdx = stops.indexOf(destination);
        if (srcIdx !== -1 && destIdx !== -1 && srcIdx < destIdx) {
          // Add computed data
          const startTime = convertToMinutes(bus.route[srcIdx].time);
          const endTime = convertToMinutes(bus.route[destIdx].time);
          return {
            ...bus,
            stopCount: destIdx - srcIdx,
            duration: endTime - startTime,
            srcIdx,
            destIdx
          };
        }
        return null;
      })
      .filter(bus => bus !== null);

  } else if (searchType === "bus-name") {
    const busName = document.getElementById("busName").value.trim().toLowerCase();
    filtered = busRoutes.filter(bus => bus.busName.toLowerCase().includes(busName));

  } else if (searchType === "bus-number") {
    const busNumber = document.getElementById("busNumber").value.trim();
    filtered = busRoutes.filter(bus => bus.busNumber === busNumber);
  }

  // Time filter
  if (timeFilter) {
    filtered = filtered.filter(bus =>
      bus.route.some(stop => getTimePeriod(stop.time) === timeFilter)
    );
  }

  displayResults(filtered, searchType);
}

function displayResults(buses, searchType) {
  const resultsDiv = document.getElementById("results");
  resultsDiv.innerHTML = "";

  if (buses.length === 0) {
    resultsDiv.innerHTML = "<p>No matching buses found.</p>";
    return;
  }

  buses.forEach((bus, index) => {
    const card = document.createElement("div");
    card.className = "bus-card";

    const extraInfo = (searchType === "source-destination")
      ? `<p><strong>Stops:</strong> ${bus.stopCount}</p>
         <p><strong>Duration:</strong> ${formatDuration(bus.duration)}</p>`
      : "";

    const initialRoute = `
      <div class="route-summary">
        <p><strong>Source:</strong> ${bus.route[0].stop}</p>
        <p><strong>Destination:</strong> ${bus.route[bus.route.length - 1].stop}</p>
        <button class="show-full-route" onclick="toggleFullRoute(${index})">Full Route</button>
      </div>
    `;

    const fullRoute = `
      <div class="map-route" id="route-${index}" style="display: none;">
        ${bus.route.map((r, i) => `
          <div class="stop" style="animation-delay: ${i * 0.2}s;">
            <strong>${r.stop}</strong> – ${r.time}
          </div>
        `).join("")}
      </div>
    `;

    const info = `
      <div class="bus-info">
        <div class="bus-image" style="background-image: url('${bus.image}')"></div>
        <div class="bus-details">
          <h3>${bus.busName} (${bus.busNumber})</h3>
          <p><strong>Contact:</strong> ${bus.contact}</p>
          <p><strong>Notice:</strong> ${bus.notice}</p>
          ${extraInfo}
        </div>
      </div>
      ${initialRoute}
      ${fullRoute}
    `;

    card.innerHTML = info;
    resultsDiv.appendChild(card);
  });
}

// Toggle function to show/hide full route
function toggleFullRoute(index) {
  const routeElement = document.getElementById(`route-${index}`);
  const button = event.target;

  if (routeElement.style.display === "none") {
    routeElement.style.display = "block";
    button.textContent = "Hide Full Route";
  } else {
    routeElement.style.display = "none";
    button.textContent = "Full Route";
  }
}



function convertToMinutes(timeStr) {
  const [time, period] = timeStr.split(" ");
  let [hour, minute] = time.split(":").map(Number);
  if (period === "PM" && hour !== 12) hour += 12;
  if (period === "AM" && hour === 12) hour = 0;
  return hour * 60 + minute;
}

function formatDuration(mins) {
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return `${h > 0 ? h + " hr " : ""}${m} min`;
}


  // Initial setup
  populateStops();
  updateSearchForm();
</script>

</body>
</html>
